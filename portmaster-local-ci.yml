name: Portmaster-Local CI

on:
  push:
    paths:
      - "portmaster-local/**"
      - ".github/workflows/portmaster-local-ci.yml"
  pull_request:
    paths:
      - "portmaster-local/**"

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: portmaster-local
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "portmaster-local -> target"
      - name: Test workspace
        run: cargo test --workspace
      - name: Build release binary
        run: cargo build -p portmaster-local --release

  linux:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: portmaster-local
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "portmaster-local -> target"
      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev
      - name: Test core crate
        run: cargo test -p portmaster-core
      - name: Build release binary
        run: cargo build -p portmaster-local --release

  android-core:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: portmaster-local
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "portmaster-local -> target"
      - name: Check portable core for Android
        run: cargo check -p portmaster-core --target aarch64-linux-android
