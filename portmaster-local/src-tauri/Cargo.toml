[package]
name = "portmaster-local"
version = "0.1.0"
edition = "2021"
description = "Portmaster-Local desktop shell"

[lib]
name = "portmaster_local_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "portmaster-local"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
tauri = { version = "2.12.5", default-features = false, features = ["wry", "common-controls-v6", "custom-protocol", "tray-icon"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
portmaster-core = { path = "../core" }
